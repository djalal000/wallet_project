services:

  postgres:
    image: postgres:16
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: wallet-app
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: change-this-secret-key-to-a-long-random-secret-value-123456789
      JWT_EXPIRATION_MS: 3600000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet
    depends_on:
      - postgres

volumes:
  postgres_data: